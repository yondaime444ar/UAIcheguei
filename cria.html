<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAIcheguei — Cadastro</title>

<style>
:root {
    --laranja: #e15800;
    --marrom: #4f3011;
}

* {
    box-sizing: border-box;
}

body {
    background-image: linear-gradient(135deg, rgba(48, 27, 12, 0.35), rgba(225, 88, 0, 0.18)), url("https://uploads.onecompiler.io/44g7ujbgc/1787313298296/ChatGPT%20Image%2021%20de%20ago.%20de%202026,%2008_45_55.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 28px 18px;
    color: #24170e;
    font-family: Arial, sans-serif;
}

.form-box {
    position: relative;
    width: min(460px, 100%);
    padding: 56px 36px 34px;
    border: 1px solid rgba(255, 255, 255, 0.75);
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 20px 55px rgba(45, 25, 10, 0.3);
}

.voltar {
    position: absolute;
    top: 16px;
    left: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border: 1px solid #f1d5c5;
    border-radius: 50%;
    color: var(--laranja);
    font-size: 1.8rem;
    line-height: 1;
    padding-bottom: 6px;
    text-decoration: none;
    transition: 160ms ease;
}

.voltar:hover {
    background-color: var(--laranja);
    border-color: var(--laranja);
    color: white;
    transform: translateX(-2px);
}

.form-box h1 {
    margin: 0 0 8px;
    color: var(--marrom);
    text-align: center;
    font-size: clamp(1.8rem, 5vw, 2.2rem);
    letter-spacing: -1px;
}

.form-box p {
    margin-bottom: 20px;
    color: #81776f;
    text-align: center;
}

.data-label {
    display: block;
    margin: 10px 8px 0;
    color: #65594f;
    font-size: 0.88rem;
    font-weight: 600;
}

.campo-form {
    width: 100%;
    margin: 7px 0;
    padding: 13px 16px;
    border: 1px solid #e4ddd6;
    border-radius: 13px;
    background: #fcfbfa;
    color: #24170e;
    font: inherit;
    font-size: 0.96rem;
    outline: none;
    transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
}

.campo-form::placeholder {
    color: #a49a91;
}

.campo-form:focus {
    border-color: var(--laranja);
    background: white;
    box-shadow: 0 0 0 3px rgba(225, 88, 0, 0.12);
}

.botao {
    width: 100%;
    margin-top: 13px;
    padding: 14px;
    border: 0;
    border-radius: 13px;
    background: linear-gradient(135deg, #f2762c, var(--laranja));
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 16px rgba(225, 88, 0, 0.23);
    transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
}

.botao:hover {
    background: linear-gradient(135deg, #e9651b, #c94d00);
    box-shadow: 0 9px 20px rgba(225, 88, 0, 0.3);
    transform: translateY(-1px);
}

#mensagem {
    margin-top: 12px;
    text-align: center;
    color: #c0392b;
    font-size: 0.9rem;
}

@media (max-width: 480px) {
    .form-box {
        padding: 58px 22px 26px;
        border-radius: 21px;
    }

    .campo-form {
        padding: 12px 14px;
    }
}
</style>
</head>

<body>

<main class="form-box">

    <a class="voltar" href="index.html" aria-label="Voltar">←</a>

    <h1>Cadastre-se</h1>

    <p>Crie sua conta UAIcheguei</p>

    <form>

        <input
            class="campo-form"
            id="nome"
            type="text"
            placeholder="Nome completo"
            required
        >

        <input
            class="campo-form"
            id="Email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            class="campo-form"
            id="telefone"
            type="tel"
            placeholder="Número de telefone"
            required
        >

        <label class="data-label" for="data-nascimento">
            Data de nascimento
        </label>

        <input
            class="campo-form"
            id="data-nascimento"
            type="date"
            required
        >

        <input
            class="campo-form"
            id="Senha"
            type="password"
            placeholder="Senha"
            required
        >

        <input
            class="campo-form"
            id="ConfirmarSenha"
            type="password"
            placeholder="Confirme sua senha"
            required
        >

        <button
            class="botao"
            type="button"
            onclick="entrar()"
        >
            Criar conta
        </button>

        <div id="mensagem"></div>

    </form>

</main>

<script>

function entrar() {

    let nome = document.getElementById("nome").value.trim();

    let gmail = document.getElementById("Email").value.trim().toLowerCase();

    let telefone = document.getElementById("telefone").value.trim();

    let data = document.getElementById("data-nascimento").value;

    let senha = document.getElementById("Senha").value;

    let confirmarSenha = document.getElementById("ConfirmarSenha").value;


    if (
        nome === "" ||
        gmail === "" ||
        telefone === "" ||
        data === "" ||
        senha === "" ||
        confirmarSenha === ""
    ) {
        document.getElementById("mensagem").innerHTML =
            "Preencha todos os campos.";
        return;
    }
    if (senha !== confirmarSenha) {
        document.getElementById("mensagem").innerHTML =
            "As senhas não conferem.";
        return;
    }
    if (gmail === "cliente@gmail.com" && senha === "123456") {
        window.location.href = "principal.html";
    }
    else if (gmail === "dono@gmail.com" && senha === "123456") {
        window.location.href = "intranet_adm.html";
    }
    else if (gmail === "entregador@gmail.com" && senha === "123456") {
        window.location.href = "intranet_entregador.html";
    }
    else {
        document.getElementById("mensagem").innerHTML =
            "Email ou senha não conferem.";
    }

}
</script>

</body>
</html>

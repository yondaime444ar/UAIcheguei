<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAIcheguei — Cadastro</title>


    <link rel="stylesheet" href="uai.css">
    <script src="tema.js" defer></script>
</head>

<body class="register-page">

<main class="form-box">

    <a class="voltar" href="index.html" aria-label="Voltar">←</a>

    <h1>Cadastre-se</h1>

    <p>Crie sua conta UAIcheguei</p>

    <form>

        <input
            class="campo-form"
            id="nome"
            type="text"
            placeholder="Nome completo"
            required
        >

        <input
            class="campo-form"
            id="Email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            class="campo-form"
            id="telefone"
            type="tel"
            placeholder="Número de telefone"
            required
        >

        <label class="data-label" for="data-nascimento">
            Data de nascimento
        </label>

        <input
            class="campo-form"
            id="data-nascimento"
            type="date"
            required
        >

        <input
            class="campo-form"
            id="Senha"
            type="password"
            placeholder="Senha"
            required
        >

        <input
            class="campo-form"
            id="ConfirmarSenha"
            type="password"
            placeholder="Confirme sua senha"
            required
        >

        <button
            class="botao"
            type="button"
            onclick="entrar()"
        >
            Criar conta
        </button>

        <div id="mensagem"></div>

    </form>

</main>

<script>

function entrar() {

    let nome = document.getElementById("nome").value.trim();

    let gmail = document.getElementById("Email").value.trim().toLowerCase();

    let telefone = document.getElementById("telefone").value.trim();

    let data = document.getElementById("data-nascimento").value;

    let senha = document.getElementById("Senha").value;

    let confirmarSenha = document.getElementById("ConfirmarSenha").value;


    if (
        nome === "" ||
        gmail === "" ||
        telefone === "" ||
        data === "" ||
        senha === "" ||
        confirmarSenha === ""
    ) {
        document.getElementById("mensagem").innerHTML =
            "Preencha todos os campos.";
        return;
    }
    if (senha !== confirmarSenha) {
        document.getElementById("mensagem").innerHTML =
            "As senhas não conferem.";
        return;
    }
    if (gmail === "cliente@gmail.com" && senha === "123456") {
        window.location.href = "principal.html";
    }
    else if (gmail === "dono@gmail.com" && senha === "123456") {
        window.location.href = "intranet_adm.html";
    }
    else if (gmail === "entregador@gmail.com" && senha === "123456") {
        window.location.href = "intranet_entregador.html";
    }
    else {
        document.getElementById("mensagem").innerHTML =
            "Email ou senha não conferem.";
    }

}
</script>

</body>
</html>

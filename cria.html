<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAIcheguei — Cadastro</title>


    <link rel="stylesheet" href="uai.css">
</head>

<body class="register-page">
<div class="theme-switch-wrap">
<input class="theme-switch-input" type="checkbox" id="theme-toggle">
<label class="theme-switch" for="theme-toggle" aria-label="Alternar tema claro e escuro"><span class="theme-sun">☼</span><span class="theme-moon">☾</span></label>
</div>

<main class="form-box">

    <a class="voltar" href="index.html" aria-label="Voltar">←</a>

    <h1>Cadastre-se</h1>

    <p>Crie sua conta UAIcheguei</p>

    <form id="formulario-cadastro">

        <input
            class="campo-form"
            id="nome"
            type="text"
            minlength="3"
            autocomplete="name"
            placeholder="Nome completo"
            required
        >

        <input
            class="campo-form"
            id="Email"
            type="email"
            autocomplete="email"
            placeholder="Email"
            required
        >

        <input
            class="campo-form"
            id="telefone"
            type="tel"
            minlength="10"
            maxlength="20"
            pattern="[0-9()+. -]{10,20}"
            title="Digite um telefone válido."
            placeholder="Número de telefone"
            required
        >

        <label class="data-label" for="data-nascimento">
            Data de nascimento
        </label>

        <input
            class="campo-form"
            id="data-nascimento"
            type="date"
            max="2008-11-14"
            required
        >

        <input
            class="campo-form"
            id="Senha"
            type="password"
            value="12345678"
            autocomplete="new-password"
            placeholder="Senha padrão"
            readonly
            required
        >

        <input
            class="campo-form"
            id="ConfirmarSenha"
            type="password"
            value="12345678"
            autocomplete="new-password"
            placeholder="Confirme sua senha"
            readonly
            required
        >

        <button
            class="botao"
            type="submit"
        >
            Criar conta
        </button>

        <p class="static-form-note">Senha padrão para todas as contas demonstrativas: 12345678.</p>

    </form>

</main>
 

    <script src="auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAIcheguei — Cadastro</title>


    <link rel="stylesheet" href="uai.css">
    <script src="tema.js" defer></script>
</head>

<body class="register-page">

<main class="form-box">

    <a class="voltar" href="index.html" aria-label="Voltar">←</a>

    <h1>Cadastre-se</h1>

    <p>Crie sua conta UAIcheguei</p>

    <form onsubmit="criarConta(event)">

        <input
            class="campo-form"
            id="nome"
            type="text"
            placeholder="Nome completo"
            required
        >

        <input
            class="campo-form"
            id="Email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            class="campo-form"
            id="telefone"
            type="tel"
            placeholder="Número de telefone"
            required
        >

        <label class="data-label" for="data-nascimento">
            Data de nascimento
        </label>

        <input
            class="campo-form"
            id="data-nascimento"
            type="date"
            required
        >

        <input
            class="campo-form"
            id="Senha"
            type="password"
            placeholder="Senha"
            required
        >

        <input
            class="campo-form"
            id="ConfirmarSenha"
            type="password"
            placeholder="Confirme sua senha"
            required
        >

        <button
            class="botao"
            type="submit"
        >
            Criar conta
        </button>

        <div id="mensagem"></div>

    </form>

</main>

<script>
function criarConta(event) {
    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("Email").value.trim().toLowerCase();
    const telefone = document.getElementById("telefone").value.trim();
    const nascimento = document.getElementById("data-nascimento").value;
    const senha = document.getElementById("Senha").value;
    const confirmarSenha = document.getElementById("ConfirmarSenha").value;
    const mensagem = document.getElementById("mensagem");
    const dataLimite = new Date();
    dataLimite.setHours(0, 0, 0, 0);
    dataLimite.setFullYear(dataLimite.getFullYear() - 18);
    const dataNascimento = new Date(nascimento + "T00:00:00");

    if (!nome || !email || !telefone || !nascimento || !senha || !confirmarSenha) {
        mensagem.textContent = "Preencha todos os campos.";
        return;
    }

    if (Number.isNaN(dataNascimento.getTime()) || dataNascimento > new Date(new Date().setHours(0, 0, 0, 0))) {
        mensagem.textContent = "A data de nascimento não pode ser futura.";
        return;
    }

    if (dataNascimento > dataLimite) {
        mensagem.textContent = "Você precisa ter pelo menos 18 anos para criar uma conta.";
        return;
    }

    if (senha !== confirmarSenha) {
        mensagem.textContent = "As senhas não conferem.";
        return;
    }

    const contas = JSON.parse(localStorage.getItem("uai-contas") || "[]");

    if (contas.some(conta => conta.email === email)) {
        mensagem.textContent = "Este e-mail já possui uma conta.";
        return;
    }

    contas.push({ nome: nome, email: email, telefone: telefone, nascimento: nascimento, senha: senha });
    localStorage.setItem("uai-contas", JSON.stringify(contas));
    mensagem.textContent = "Conta criada! Agora entre com seu e-mail e senha.";
    window.location.href = "index.html";
}

const campoNascimento = document.getElementById("data-nascimento");
const hoje = new Date();
const limiteNascimento = new Date(hoje.getFullYear() - 18, hoje.getMonth(), hoje.getDate());
const formatarData = data => {
    const ano = data.getFullYear();
    const mes = String(data.getMonth() + 1).padStart(2, "0");
    const dia = String(data.getDate()).padStart(2, "0");
    return ano + "-" + mes + "-" + dia;
};
campoNascimento.max = formatarData(limiteNascimento);
</script>

</body>
</html>

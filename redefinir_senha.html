<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fcfbf9">
<title>Redefinir senha | UAI CHEGUEI</title>
<link rel="stylesheet" href="uai.css">
</head>
<body class="reset-page">
<div class="theme-switch-wrap">
<input class="theme-switch-input" type="checkbox" id="theme-toggle">
<label class="theme-switch" for="theme-toggle" aria-label="Alternar tema claro e escuro"><span class="theme-sun">☼</span><span class="theme-moon">☾</span></label>
</div>
<main class="container">
<section class="caixa-branca">
<a href="index.html" class="voltar">← Voltar</a>
<h1>Redefinir senha</h1>
<p class="reset-description">Informe seu e-mail para recuperar o acesso à sua conta.</p>
<form class="reset-form">
<label class="reset-label" for="email">E-mail</label>
<input type="email" id="email" class="campo-form" placeholder="Digite seu e-mail" autocomplete="email" required>
<button type="submit" class="buton-entrar" disabled>Solicitar redefinição</button>
<p class="static-form-note">A recuperação de senha ainda não está disponível nesta versão sem JavaScript.</p>
</form>
</section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir Senha - UAIcheguei</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #e15800;
            background-image: url("https://uploads.onecompiler.io/44g7ujbgc/1787313298296/ChatGPT%20Image%2021%20de%20ago.%20de%202026,%2008_45_55.png");
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            min-height: 100vh;
        }

        .caixa-branca {
            position: relative;
            background-color: white;
            padding: 56px 40px 40px;
            border-radius: 20px;
            width: min(460px, calc(100% - 32px));
            text-align: center;
            color: #333;
            font-size: 0.95em;
            box-shadow: 0 12px 32px rgba(55, 31, 12, 0.22);
        }

        .caixa-branca h1 {
            margin: 8px 0 12px;
            color: #4f3011;
            font-size: 1.8em;
        }

        .caixa-branca p {
            line-height: 1.5;
        }

        .campo-form {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 15px;
            border: 2px solid #666;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
        }

        .campo-form:focus {
            border-color: #e15800;
        }

        .buton-entrar {
            background-color: #e15800;
            padding: 11px 18px;
            border: none;
            border-radius: 12px;
            width: 100%;
            min-height: 46px;
            text-align: center;
            color: white;
            margin: 4px 0 18px;
            cursor: pointer;
            font: inherit;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        .buton-entrar h2 {
            margin: 0;
            font-size: 1rem;
        }

        .buton-entrar:hover {
            background-color: #c94d00;
        }

        .buton-entrar:active {
            transform: translateY(1px);
        }

        .voltar {
            position: absolute;
            left: 20px;
            top: 20px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
        }

        .voltar:hover {
            color: #e15800;
        }

        #mensagem {
            margin-top: 15px;
            color: red;
            font-weight: bold;
        }

        .codigo {
            margin-top: 5px;
        }

        [hidden] {
            display: none !important;
        }

    </style>

    <link rel="stylesheet" href="melhorias.css">
</head>

<body>

    <div class="container">

        <div class="caixa-branca">

            <a href="index.html" class="voltar">
                ← Voltar
            </a>

            <br><br>

            <h1>Redefinir Senha</h1>

            <p style="color: #999;">
                No UAIcheguei, o melhor app<br>
                de comida de Minas Gerais
            </p>

            <br>

            <div id="etapaEmail">
                <p>Digite seu e-mail:</p>
                <input
                    type="email"
                    id="email"
                    class="campo-form"
                    placeholder="Digite seu e-mail"
                    required
                >
                <button
                    type="button"
                    class="buton-entrar"
                    onclick="enviarCodigo()"
                >
                    <h2>Enviar código</h2>
                </button>
            </div>

            <div id="etapaCodigo" hidden>
                <p>Digite o código enviado para seu e-mail:</p>
                <input
                    type="text"
                    id="codigo"
                    class="campo-form codigo"
                    placeholder="Digite o código"
                    inputmode="numeric"
                >
                <button
                    type="button"
                    class="buton-entrar"
                    onclick="verificarCodigo()"
                >
                    <h2>Verificar código</h2>
                </button>
            </div>

            <div id="etapaSenha" hidden>
                <p>Digite sua nova senha:</p>
                <input
                    type="password"
                    id="senha"
                    class="campo-form"
                    placeholder="Digite sua nova senha"
                >
                <input
                    type="password"
                    id="confirmarSenha"
                    class="campo-form"
                    placeholder="Confirme sua nova senha"
                >
                <button
                    type="button"
                    class="buton-entrar"
                    onclick="redefinirSenha()"
                >
                    <h2>Salvar nova senha</h2>
                </button>
            </div>

            <p id="mensagem" aria-live="polite"></p>
        </div>
    </div>
   

    <script>
        // Código de demonstração: em um sistema real, o servidor enviaria o código por e-mail.
        const codigoCorreto = "123456";

        function enviarCodigo() {
            const email = document.getElementById("email");
            const mensagem = document.getElementById("mensagem");

            if (!email.value.trim() || !email.checkValidity()) {
                mensagem.textContent = "Digite um e-mail válido.";
                email.focus();
                return;
            }

            document.getElementById("etapaCodigo").hidden = false;
            mensagem.textContent = "Código enviado. Para teste, use 123456.";
            document.getElementById("codigo").focus();
        }

        function verificarCodigo() {
            const codigo = document.getElementById("codigo").value.trim();
            const mensagem = document.getElementById("mensagem");

            if (codigo !== codigoCorreto) {
                mensagem.textContent = "Código incorreto. Confira e tente novamente.";
                return;
            }

            document.getElementById("etapaEmail").hidden = true;
            document.getElementById("etapaCodigo").hidden = true;
            document.getElementById("etapaSenha").hidden = false;
            mensagem.textContent = "Código confirmado. Agora crie sua nova senha.";
            document.getElementById("senha").focus();
        }

        function redefinirSenha() {
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;
            const mensagem = document.getElementById("mensagem");

            if (!senha || !confirmarSenha) {
                mensagem.textContent = "Preencha os dois campos de senha.";
                return;
            }

            if (senha !== confirmarSenha) {
                mensagem.textContent = "As senhas não conferem.";
                return;
            }

            mensagem.textContent = "Nova senha definida com sucesso.";
        }
    </script>

</body>

</html>
